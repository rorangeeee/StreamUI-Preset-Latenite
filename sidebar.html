<!doctype html><html lang="zh-CN"><meta charset="utf-8"><script src="/config-appearance.js"></script><link rel="stylesheet" href="/config-theme.css"><style>body{margin:0;font:14px system-ui;color:var(--text)}label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 10px}input{accent-color:var(--accent);width:17px;height:17px}</style><label>暂离模式<input id="away" type="checkbox" role="switch"></label><script type="module">
import {createClient} from '/sdk/streamui.js';
const client=createClient(),control=document.getElementById('away');let state,lastNormal;
client.onState(value=>{state=value;const active=value.scenes.find(scene=>scene.id===value.scene.activeId);if(active?.view!=='away')lastNormal=active?.id;control.checked=active?.view==='away';});
control.onchange=()=>{const target=control.checked?state.scenes.find(scene=>scene.view==='away')?.id:lastNormal??state.scenes.find(scene=>scene.view!=='away')?.id;if(target)void client.selectScene(target);};
client.start();addEventListener('pagehide',()=>client.stop());
</script></html>
