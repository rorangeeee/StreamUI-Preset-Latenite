<!doctype html><html lang="zh-CN"><meta charset="utf-8"><script src="/config-appearance.js"></script><link rel="stylesheet" href="/config-theme.css"><style>body{margin:0;font:14px system-ui;color:var(--text)}label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 10px}input{accent-color:var(--accent);width:17px;height:17px}output{display:block;font-size:12px;color:var(--error);padding:0 10px}</style><label>暂离模式<input id="away" type="checkbox" role="switch"></label><output role="status"></output><script type="module">
import {createClient,getSceneContext,createAutoSave} from '/sdk/streamui.js';
const client=createClient(),id=getSceneContext().presetId,settings=client.settings('preset',id),control=document.getElementById('away'),status=document.querySelector('output');
let pending=false;
const refresh=async()=>{const values=await settings.read();if(!pending)control.checked=values.controls.away;};
const save=createAutoSave(patch=>settings.patch(patch),{
 onStatus:value=>{pending=value==='pending'||value==='saving';if(value==='saved'){status.textContent='';void refresh();}},
 onError:error=>{status.textContent=error.message;},
});
control.onchange=()=>save.update({controls:{away:control.checked}},true);
client.on('preset.settingsChanged',value=>{if(value.id===id&&!pending)void refresh();});
void refresh();client.start();
addEventListener('pagehide',()=>{void save.flush().catch(()=>{});client.stop();});
</script></html>
